<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repor Password — Maria Bonita</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bordeaux:#4a1420; --gold:#c9a15f; --cream:#f7f0e6; --rose:#b5495b; --ink:#241012; --line:rgba(201,161,95,0.35); }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Jost',sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  h1{font-family:'Playfair Display',serif; color:var(--bordeaux); font-size:1.6rem; margin-bottom:8px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:6px; padding:40px 36px; max-width:420px; width:100%; box-shadow:0 30px 60px -20px rgba(52,9,15,0.15);}
  p{color:#6b5259; font-size:0.9rem; margin-bottom:24px;}
  .field{margin-bottom:18px;}
  label{display:block; font-size:0.76rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--bordeaux); margin-bottom:8px; font-weight:500;}
  input{width:100%; padding:12px 14px; border:1px solid #ddccb8; border-radius:2px; font-family:'Jost'; font-size:0.95rem; background:#fdfaf5;}
  input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,161,95,0.18);}
  button{width:100%; padding:14px; background:var(--bordeaux); color:var(--cream); border:none; border-radius:2px; font-size:0.85rem; text-transform:uppercase; letter-spacing:0.1em; cursor:pointer; margin-top:6px;}
  button:hover{background:var(--rose);}
  .msg{font-size:0.87rem; padding:12px 14px; border-radius:3px; margin-bottom:18px; display:none;}
  .msg.show{display:block;}
  .msg.error{background:#fbeaea; color:#a4322a; border:1px solid #f0c6c2;}
  .msg.success{background:#e9f4ec; color:#2f6b48; border:1px solid #c3e2cd;}
  a{color:var(--rose);}
</style>
</head>
<body>
  <div class="card">
    <h1>Escolher nova password</h1>
    <p>Introduza a sua nova password de acesso ao site da Maria Bonita.</p>
    <div class="msg" id="msg"></div>
    <form id="resetForm">
      <div class="field">
        <label for="pass">Nova password</label>
        <input id="pass" type="password" placeholder="Mínimo 6 caracteres" required minlength="6">
      </div>
      <div class="field">
        <label for="pass2">Confirmar password</label>
        <input id="pass2" type="password" placeholder="Repita a password" required minlength="6">
      </div>
      <button type="submit">Guardar nova password</button>
    </form>
  </div>

<script>
  // O site e a API vivem no mesmo servidor — não é preciso configurar nada.
  const API_BASE = '';

  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const form = document.getElementById('resetForm');
  const msg = document.getElementById('msg');

  function showMsg(text, type){
    msg.textContent = text;
    msg.className = 'msg show ' + type;
  }

  if(!token){
    showMsg('Falta o código de recuperação neste link. Peça um novo email de recuperação no site.', 'error');
    form.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pass = document.getElementById('pass').value;
    const pass2 = document.getElementById('pass2').value;

    if(pass.length < 6){ showMsg('A password deve ter pelo menos 6 caracteres.', 'error'); return; }
    if(pass !== pass2){ showMsg('As passwords não coincidem.', 'error'); return; }

    try{
      const res = await fetch(API_BASE + '/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: pass })
      });
      const data = await res.json();
      if(!res.ok){ showMsg(data.message || 'Não foi possível repor a password.', 'error'); return; }
      showMsg(data.message + ' Pode fechar esta página e entrar no site.', 'success');
      form.style.display = 'none';
    }catch(err){
      showMsg('Não foi possível ligar ao servidor. Tente novamente mais tarde.', 'error');
    }
  });
</script>
</body>
</html>
